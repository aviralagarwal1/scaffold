name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: scaffold-496000
  PROJECT_NUMBER: "115995315434"
  REGION: us-east1
  SERVICE_NAME: substack-ai
  ARTIFACT_REPOSITORY: substack-ai
  IMAGE_NAME: substack-ai
  WORKLOAD_IDENTITY_PROVIDER: projects/115995315434/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-actions-deployer@scaffold-496000.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build image with Cloud Build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          gcloud builds submit --quiet --tag "${IMAGE}" .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --quiet \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300

      - name: Verify deployment
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "Cloud Run URL: ${URL}"
          curl --fail --silent --show-error --head "${URL}"
